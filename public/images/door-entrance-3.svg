          <line x1="135" y1="765" x2="465" y2="765" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
          <!-- Brass Inlay Studs -->
          <circle cx="145" cy="765" r="4" fill="url(#brass_door_6)"/>
