          <line x1="135" y1="585" x2="465" y2="585" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
          <!-- Brass Inlay Studs -->
          <circle cx="145" cy="585" r="4" fill="url(#brass_door_6)"/>
          <circle cx="455" cy="585" r="4" fill="url(#brass_door_6)"/>
        
