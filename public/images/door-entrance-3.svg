<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
    
    <defs>
      <!-- Wood Grain Gradient -->
      <linearGradient id="woodGrad_door_6" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1C0F08" />
        <stop offset="25%" stop-color="#321E14" />
        <stop offset="50%" stop-color="#4F3323" />
        <stop offset="75%" stop-color="#321E14" />
        <stop offset="100%" stop-color="#1C0F08" />
      </linearGradient>

      <!-- Vertical Grain Texture Pattern -->
      <pattern id="grain_door_6" width="40" height="200" patternUnits="userSpaceOnUse">
        <line x1="8" y1="0" x2="8" y2="200" stroke="#1C0F08" stroke-width="0.8" opacity="0.35"/>
        <line x1="16" y1="0" x2="16" y2="200" stroke="#4F3323" stroke-width="0.6" opacity="0.4"/>
        <line x1="25" y1="0" x2="25" y2="200" stroke="#1C0F08" stroke-width="1.2" opacity="0.3"/>
        <line x1="33" y1="0" x2="33" y2="200" stroke="#4F3323" stroke-width="0.5" opacity="0.3"/>
      </pattern>

      <!-- 3D Bevel Shadow Filter -->
      <filter id="bevel_door_6" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#050302" flood-opacity="0.55"/>
      </filter>

      <!-- Recessed Panel Shadow -->
      <filter id="inset_door_6" x="-5%" y="-5%" width="110%" height="110%">
        <feOffset dx="2" dy="3"/>
        <feGaussianBlur stdDeviation="3" result="offset-blur"/>
        <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
        <feFlood flood-color="#000000" flood-opacity="0.6" result="color"/>
        <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
        <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
      </filter>

      <!-- Brass Hardware Metallic Gradient -->
      <linearGradient id="brass_door_6" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#EED58E" />
        <stop offset="40%" stop-color="#C5A059" />
        <stop offset="70%" stop-color="#8F6B2E" />
        <stop offset="100%" stop-color="#D4AF37" />
      </linearGradient>
    </defs>
  
    
      <rect width="600" height="900" fill="#E6DDD2"/>
      <!-- Grand Granite Portal Surround -->
      <rect x="60" y="40" width="480" height="820" fill="#3D3A37" stroke="#252321" stroke-width="8"/>
      <rect x="80" y="60" width="440" height="800" fill="#140B06"/>

      <!-- Heavy Pivot Door Leaf -->
      <rect x="95" y="75" width="410" height="785" fill="url(#woodGrad_door_6)" filter="url(#bevel_door_6)"/>
      <rect x="95" y="75" width="410" height="785" fill="url(#grain_door_6)"/>

      <!-- Massive Timber Beams / Stacks -->
      
          <rect x="120" y="100" width="360" height="70" rx="3" fill="#201108" stroke="#D4AF37" stroke-width="1.5" filter="url(#bevel_door_6)"/>
          <line x1="135" y1="135" x2="465" y2="135" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
          <!-- Brass Inlay Studs -->
          <circle cx="145" cy="135" r="4" fill="url(#brass_door_6)"/>
