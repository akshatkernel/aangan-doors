    <!-- Editorial Architectural Tag -->
    <text x="300" y="878" font-family="'Playfair Display', Georgia, serif" font-size="11" fill="#77716A" text-anchor="middle" letter-spacing="3">AANGAN DOORS • AD-006 GRANDWOOD ENTRANCE • SOLID TEAK & DARK WALNUT</text>
  </svg>