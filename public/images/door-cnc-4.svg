<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
    
    <defs>
      <!-- Wood Grain Gradient -->
      <linearGradient id="woodGrad_door_14" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#21100B" />
        <stop offset="25%" stop-color="#3A2017" />
        <stop offset="50%" stop-color="#573326" />
        <stop offset="75%" stop-color="#3A2017" />
        <stop offset="100%" stop-color="#21100B" />
      </linearGradient>

      <!-- Vertical Grain Texture Pattern -->
      <pattern id="grain_door_14" width="40" height="200" patternUnits="userSpaceOnUse">
        <line x1="8" y1="0" x2="8" y2="200" stroke="#21100B" stroke-width="0.8" opacity="0.35"/>
        <line x1="16" y1="0" x2="16" y2="200" stroke="#573326" stroke-width="0.6" opacity="0.4"/>
        <line x1="25" y1="0" x2="25" y2="200" stroke="#21100B" stroke-width="1.2" opacity="0.3"/>
        <line x1="33" y1="0" x2="33" y2="200" stroke="#573326" stroke-width="0.5" opacity="0.3"/>
      </pattern>

      <!-- 3D Bevel Shadow Filter -->
      <filter id="bevel_door_14" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#050302" flood-opacity="0.55"/>
      </filter>

      <!-- Recessed Panel Shadow -->
      <filter id="inset_door_14" x="-5%" y="-5%" width="110%" height="110%">
        <feOffset dx="2" dy="3"/>
        <feGaussianBlur stdDeviation="3" result="offset-blur"/>
        <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
        <feFlood flood-color="#000000" flood-opacity="0.6" result="color"/>
        <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
        <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
      </filter>

      <!-- Brass Hardware Metallic Gradient -->
      <linearGradient id="brass_door_14" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#EED58E" />
        <stop offset="40%" stop-color="#C5A059" />
        <stop offset="70%" stop-color="#8F6B2E" />
        <stop offset="100%" stop-color="#D4AF37" />
      </linearGradient>
    </defs>
  
    
      <rect width="600" height="900" fill="#EAE0D5"/>
      <rect x="70" y="50" width="460" height="800" fill="#1A0D07" stroke="#0D0603" stroke-width="4"/>
      <rect x="90" y="70" width="420" height="780" fill="url(#woodGrad_door_14)" filter="url(#bevel_door_14)"/>
      <rect x="90" y="70" width="420" height="780" fill="url(#grain_door_14)"/>

      <!-- Asymmetrical Architectural Precision Grid -->
      <rect x="120" y="100" width="360" height="720" fill="#221109" stroke="#D4AF37" stroke-width="2" filter="url(#bevel_door_14)"/>

      <!-- Vertical Channels -->
      <line x1="220" y1="100" x2="220" y2="820" stroke="#D4AF37" stroke-width="3" opacity="0.85"/>
      <line x1="330" y1="100" x2="330" y2="820" stroke="#D4AF37" stroke-width="3" opacity="0.85"/>

      <!-- Horizontal Channels -->
      <line x1="120" y1="260" x2="480" y2="260" stroke="#D4AF37" stroke-width="3" opacity="0.85"/>
      <line x1="120" y1="460" x2="480" y2="460" stroke="#D4AF37" stroke-width="3" opacity="0.85"/>
      <line x1="120" y1="640" x2="480" y2="640" stroke="#D4AF37" stroke-width="3" opacity="0.85"/>

      <!-- Alternating Depth Shaded Relief Pockets -->
      <rect x="135" y="115" width="70" height="130" fill="#D4AF37" opacity="0.18"/>
      <rect x="235" y="275" width="80" height="170" fill="#D4AF37" opacity="0.25"/>
      <rect x="345" y="475" width="120" height="150" fill="#D4AF37" opacity="0.2"/>
      <rect x="135" y="655" width="70" height="150" fill="#D4AF37" opacity="0.15"/>

      <!-- Brass Hardware -->
      <rect x="440" y="420" width="18" height="110" rx="3" fill="url(#brass_door_14)" filter="url(#bevel_door_14)"/>
      <circle cx="449" cy="445" r="4" fill="#120703"/>

      <rect x="60" y="850" width="480" height="25" fill="#24120A" stroke="#0C0502" stroke-width="2"/>
    
    <!-- Editorial Architectural Tag -->
    <text x="300" y="878" font-family="'Playfair Display', Georgia, serif" font-size="11" fill="#77716A" text-anchor="middle" letter-spacing="3">AANGAN DOORS • AD-014 PRECISION GRID • PADAUK TIMBER CORE & TEAK</text>
  </svg>