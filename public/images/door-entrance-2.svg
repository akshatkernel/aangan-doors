<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
    
    <defs>
      <!-- Wood Grain Gradient -->
      <linearGradient id="woodGrad_door_2" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#3A2413" />
        <stop offset="25%" stop-color="#5A3D24" />
        <stop offset="50%" stop-color="#7C5735" />
        <stop offset="75%" stop-color="#5A3D24" />
        <stop offset="100%" stop-color="#3A2413" />
      </linearGradient>

      <!-- Vertical Grain Texture Pattern -->
      <pattern id="grain_door_2" width="40" height="200" patternUnits="userSpaceOnUse">
        <line x1="8" y1="0" x2="8" y2="200" stroke="#3A2413" stroke-width="0.8" opacity="0.35"/>
        <line x1="16" y1="0" x2="16" y2="200" stroke="#7C5735" stroke-width="0.6" opacity="0.4"/>
        <line x1="25" y1="0" x2="25" y2="200" stroke="#3A2413" stroke-width="1.2" opacity="0.3"/>
        <line x1="33" y1="0" x2="33" y2="200" stroke="#7C5735" stroke-width="0.5" opacity="0.3"/>
      </pattern>

      <!-- 3D Bevel Shadow Filter -->
      <filter id="bevel_door_2" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#050302" flood-opacity="0.55"/>
      </filter>

      <!-- Recessed Panel Shadow -->
      <filter id="inset_door_2" x="-5%" y="-5%" width="110%" height="110%">
        <feOffset dx="2" dy="3"/>
        <feGaussianBlur stdDeviation="3" result="offset-blur"/>
        <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
        <feFlood flood-color="#000000" flood-opacity="0.6" result="color"/>
        <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
        <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
      </filter>

      <!-- Brass Hardware Metallic Gradient -->
      <linearGradient id="brass_door_2" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#EED58E" />
        <stop offset="40%" stop-color="#C5A059" />
        <stop offset="70%" stop-color="#8F6B2E" />
        <stop offset="100%" stop-color="#D4AF37" />
      </linearGradient>
    </defs>
  
    
      <!-- Modern Concrete/Plaster Frame -->
      <rect width="600" height="900" fill="#EAE5DC"/>
      <rect x="70" y="50" width="460" height="800" fill="#2B2623" stroke="#1E1A17" stroke-width="4"/>

      <!-- Solid Teak Door Leaf -->
      <rect x="85" y="65" width="430" height="785" fill="url(#woodGrad_door_2)" filter="url(#bevel_door_2)"/>
      <rect x="85" y="65" width="430" height="785" fill="url(#grain_door_2)"/>

      <!-- Modern Horizontal Grooved Slats -->
      
          <line x1="110" y1="95" x2="490" y2="95" stroke="#27180D" stroke-width="3"/>
