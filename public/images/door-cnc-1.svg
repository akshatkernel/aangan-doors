<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
    
    <defs>
      <!-- Wood Grain Gradient -->
      <linearGradient id="woodGrad_door_3" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#24140C" />
        <stop offset="25%" stop-color="#40291D" />
        <stop offset="50%" stop-color="#5D3E2D" />
        <stop offset="75%" stop-color="#40291D" />
        <stop offset="100%" stop-color="#24140C" />
      </linearGradient>

      <!-- Vertical Grain Texture Pattern -->
      <pattern id="grain_door_3" width="40" height="200" patternUnits="userSpaceOnUse">
        <line x1="8" y1="0" x2="8" y2="200" stroke="#24140C" stroke-width="0.8" opacity="0.35"/>
        <line x1="16" y1="0" x2="16" y2="200" stroke="#5D3E2D" stroke-width="0.6" opacity="0.4"/>
        <line x1="25" y1="0" x2="25" y2="200" stroke="#24140C" stroke-width="1.2" opacity="0.3"/>
        <line x1="33" y1="0" x2="33" y2="200" stroke="#5D3E2D" stroke-width="0.5" opacity="0.3"/>
      </pattern>

      <!-- 3D Bevel Shadow Filter -->
      <filter id="bevel_door_3" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#050302" flood-opacity="0.55"/>
      </filter>

      <!-- Recessed Panel Shadow -->
      <filter id="inset_door_3" x="-5%" y="-5%" width="110%" height="110%">
        <feOffset dx="2" dy="3"/>
        <feGaussianBlur stdDeviation="3" result="offset-blur"/>
        <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
        <feFlood flood-color="#000000" flood-opacity="0.6" result="color"/>
        <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
        <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
      </filter>

      <!-- Brass Hardware Metallic Gradient -->
      <linearGradient id="brass_door_3" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#EED58E" />
        <stop offset="40%" stop-color="#C5A059" />
        <stop offset="70%" stop-color="#8F6B2E" />
        <stop offset="100%" stop-color="#D4AF37" />
      </linearGradient>
    </defs>
  
    
      <rect width="600" height="900" fill="#E8DFD5"/>
      <rect x="70" y="50" width="460" height="800" fill="#21150F" stroke="#120A06" stroke-width="5"/>
      <rect x="90" y="70" width="420" height="780" fill="url(#woodGrad_door_3)" filter="url(#bevel_door_3)"/>
      <rect x="90" y="70" width="420" height="780" fill="url(#grain_door_3)"/>

      <!-- Large Center CNC Carved Medallion Panel -->
      <rect x="120" y="110" width="360" height="700" rx="6" fill="#25160E" stroke="#C5A059" stroke-width="2.5" filter="url(#bevel_door_3)"/>

      <!-- Multi-tier Rosette & CNC Depth Layers -->
      <circle cx="300" cy="460" r="140" fill="none" stroke="#C5A059" stroke-width="3.5"/>
      <circle cx="300" cy="460" r="115" fill="none" stroke="#C5A059" stroke-width="2" stroke-dasharray="8,6"/>
      <circle cx="300" cy="460" r="90" fill="#1C100A" stroke="#C5A059" stroke-width="3"/>
