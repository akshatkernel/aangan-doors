      <circle cx="445" cy="485" r="18" fill="none" stroke="url(#brass_door_7)" stroke-width="4.5" filter="url(#bevel_door_7)"/>
      <circle cx="445" cy="470" r="7" fill="url(#brass_door_7)"/>

