<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
    
    <defs>
      <!-- Wood Grain Gradient -->
      <linearGradient id="woodGrad_door_10" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#21130B" />
        <stop offset="25%" stop-color="#3B261A" />
        <stop offset="50%" stop-color="#573B29" />
        <stop offset="75%" stop-color="#3B261A" />
        <stop offset="100%" stop-color="#21130B" />
      </linearGradient>

      <!-- Vertical Grain Texture Pattern -->
      <pattern id="grain_door_10" width="40" height="200" patternUnits="userSpaceOnUse">
        <line x1="8" y1="0" x2="8" y2="200" stroke="#21130B" stroke-width="0.8" opacity="0.35"/>
        <line x1="16" y1="0" x2="16" y2="200" stroke="#573B29" stroke-width="0.6" opacity="0.4"/>
        <line x1="25" y1="0" x2="25" y2="200" stroke="#21130B" stroke-width="1.2" opacity="0.3"/>
        <line x1="33" y1="0" x2="33" y2="200" stroke="#573B29" stroke-width="0.5" opacity="0.3"/>
      </pattern>

      <!-- 3D Bevel Shadow Filter -->
      <filter id="bevel_door_10" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#050302" flood-opacity="0.55"/>
      </filter>

      <!-- Recessed Panel Shadow -->
      <filter id="inset_door_10" x="-5%" y="-5%" width="110%" height="110%">
        <feOffset dx="2" dy="3"/>
        <feGaussianBlur stdDeviation="3" result="offset-blur"/>
        <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
        <feFlood flood-color="#000000" flood-opacity="0.6" result="color"/>
        <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
        <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
      </filter>

      <!-- Brass Hardware Metallic Gradient -->
      <linearGradient id="brass_door_10" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#EED58E" />
        <stop offset="40%" stop-color="#C5A059" />
        <stop offset="70%" stop-color="#8F6B2E" />
        <stop offset="100%" stop-color="#D4AF37" />
      </linearGradient>
    </defs>
  
    
      <rect width="600" height="900" fill="#E8DFD5"/>
      <rect x="70" y="50" width="460" height="800" fill="#1C1008" stroke="#0E0703" stroke-width="4"/>
      <rect x="90" y="70" width="420" height="780" fill="url(#woodGrad_door_10)" filter="url(#bevel_door_10)"/>
      <rect x="90" y="70" width="420" height="780" fill="url(#grain_door_10)"/>

      <!-- Frosted Glass Backing Behind Jali Lattice -->
      <rect x="130" y="110" width="340" height="420" rx="4" fill="#DDE3E6" opacity="0.85"/>

      <!-- Jali Lattice Pattern -->
      <pattern id="jali_door_10" width="34" height="34" patternUnits="userSpaceOnUse">
        <path d="M 0 17 L 17 0 L 34 17 L 17 34 Z" fill="#29180E" stroke="#D4AF37" stroke-width="2"/>
        <circle cx="17" cy="17" r="3.5" fill="#D4AF37"/>
      </pattern>
      <rect x="130" y="110" width="340" height="420" rx="4" fill="url(#jali_door_10)" stroke="#D4AF37" stroke-width="3" filter="url(#bevel_door_10)"/>

      <!-- Lower Solid Timber Panel with Grooves -->
      <rect x="130" y="560" width="340" height="250" rx="4" fill="#23140C" stroke="#D4AF37" stroke-width="2.5" filter="url(#bevel_door_10)"/>
      <line x1="200" y1="580" x2="200" y2="780" stroke="#D4AF37" stroke-width="2" opacity="0.5"/>
      <line x1="265" y1="580" x2="265" y2="780" stroke="#D4AF37" stroke-width="3" opacity="0.8"/>
      <line x1="335" y1="580" x2="335" y2="780" stroke="#D4AF37" stroke-width="3" opacity="0.8"/>
      <line x1="400" y1="580" x2="400" y2="780" stroke="#D4AF37" stroke-width="2" opacity="0.5"/>

      <!-- Brass Handle -->
      <rect x="440" y="470" width="20" height="110" rx="3" fill="url(#brass_door_10)" filter="url(#bevel_door_10)"/>
      <circle cx="450" cy="495" r="4" fill="#140905"/>
      <path d="M 450 510 L 450 555" stroke="#140905" stroke-width="4" stroke-linecap="round"/>

      <rect x="60" y="850" width="480" height="25" fill="#22130A" stroke="#0F0703" stroke-width="2"/>
    
    <!-- Editorial Architectural Tag -->
    <text x="300" y="878" font-family="'Playfair Display', Georgia, serif" font-size="11" fill="#77716A" text-anchor="middle" letter-spacing="3">AANGAN DOORS • AD-010 ROYAL JALI • SOLID HARDWOOD & TEAK</text>
  </svg>