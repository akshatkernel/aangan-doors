<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
    
    <defs>
      <!-- Wood Grain Gradient -->
      <linearGradient id="woodGrad_door_9" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1A0C06" />
        <stop offset="25%" stop-color="#2D180F" />
        <stop offset="50%" stop-color="#482B1C" />
        <stop offset="75%" stop-color="#2D180F" />
        <stop offset="100%" stop-color="#1A0C06" />
      </linearGradient>

      <!-- Vertical Grain Texture Pattern -->
      <pattern id="grain_door_9" width="40" height="200" patternUnits="userSpaceOnUse">
        <line x1="8" y1="0" x2="8" y2="200" stroke="#1A0C06" stroke-width="0.8" opacity="0.35"/>
        <line x1="16" y1="0" x2="16" y2="200" stroke="#482B1C" stroke-width="0.6" opacity="0.4"/>
        <line x1="25" y1="0" x2="25" y2="200" stroke="#1A0C06" stroke-width="1.2" opacity="0.3"/>
        <line x1="33" y1="0" x2="33" y2="200" stroke="#482B1C" stroke-width="0.5" opacity="0.3"/>
      </pattern>

      <!-- 3D Bevel Shadow Filter -->
      <filter id="bevel_door_9" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#050302" flood-opacity="0.55"/>
      </filter>

      <!-- Recessed Panel Shadow -->
      <filter id="inset_door_9" x="-5%" y="-5%" width="110%" height="110%">
        <feOffset dx="2" dy="3"/>
        <feGaussianBlur stdDeviation="3" result="offset-blur"/>
        <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
        <feFlood flood-color="#000000" flood-opacity="0.6" result="color"/>
        <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
        <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
      </filter>

      <!-- Brass Hardware Metallic Gradient -->
      <linearGradient id="brass_door_9" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#EED58E" />
        <stop offset="40%" stop-color="#C5A059" />
        <stop offset="70%" stop-color="#8F6B2E" />
        <stop offset="100%" stop-color="#D4AF37" />
      </linearGradient>
    </defs>
  
    
      <rect width="600" height="900" fill="#E5DDD2"/>
      <!-- Monumental Haveli Arch Frame -->
      <path d="M 50 850 L 50 280 Q 300 50 550 280 L 550 850 Z" fill="#4A3428" stroke="#332117" stroke-width="10"/>
      <path d="M 68 850 L 68 290 Q 300 70 532 290 L 532 850 Z" fill="#140904"/>

      <!-- Left Door Leaf -->
      <path d="M 80 850 L 80 300 Q 185 160 295 120 L 295 850 Z" fill="url(#woodGrad_door_9)" filter="url(#bevel_door_9)"/>
      <path d="M 80 850 L 80 300 Q 185 160 295 120 L 295 850 Z" fill="url(#grain_door_9)"/>

      <!-- Right Door Leaf -->
      <path d="M 305 850 L 305 120 Q 415 160 520 300 L 520 850 Z" fill="url(#woodGrad_door_9)" filter="url(#bevel_door_9)"/>
      <path d="M 305 850 L 305 120 Q 415 160 520 300 L 520 850 Z" fill="url(#grain_door_9)"/>

      <!-- Center Overlap Astragal / Molding -->
      <rect x="294" y="110" width="12" height="740" fill="#1A0C06" stroke="#D4AF37" stroke-width="1.5"/>

