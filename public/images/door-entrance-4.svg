<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
    
    <defs>
      <!-- Wood Grain Gradient -->
      <linearGradient id="woodGrad_door_13" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1A110C" />
        <stop offset="25%" stop-color="#2B1E16" />
        <stop offset="50%" stop-color="#473226" />
        <stop offset="75%" stop-color="#2B1E16" />
        <stop offset="100%" stop-color="#1A110C" />
      </linearGradient>

      <!-- Vertical Grain Texture Pattern -->
      <pattern id="grain_door_13" width="40" height="200" patternUnits="userSpaceOnUse">
        <line x1="8" y1="0" x2="8" y2="200" stroke="#1A110C" stroke-width="0.8" opacity="0.35"/>
        <line x1="16" y1="0" x2="16" y2="200" stroke="#473226" stroke-width="0.6" opacity="0.4"/>
        <line x1="25" y1="0" x2="25" y2="200" stroke="#1A110C" stroke-width="1.2" opacity="0.3"/>
        <line x1="33" y1="0" x2="33" y2="200" stroke="#473226" stroke-width="0.5" opacity="0.3"/>
      </pattern>

      <!-- 3D Bevel Shadow Filter -->
      <filter id="bevel_door_13" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#050302" flood-opacity="0.55"/>
      </filter>

      <!-- Recessed Panel Shadow -->
      <filter id="inset_door_13" x="-5%" y="-5%" width="110%" height="110%">
        <feOffset dx="2" dy="3"/>
        <feGaussianBlur stdDeviation="3" result="offset-blur"/>
        <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
        <feFlood flood-color="#000000" flood-opacity="0.6" result="color"/>
        <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
        <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
      </filter>

      <!-- Brass Hardware Metallic Gradient -->
      <linearGradient id="brass_door_13" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#EED58E" />
        <stop offset="40%" stop-color="#C5A059" />
        <stop offset="70%" stop-color="#8F6B2E" />
        <stop offset="100%" stop-color="#D4AF37" />
      </linearGradient>
    </defs>
  
    
      <rect width="600" height="900" fill="#E8DFD5"/>
      <rect x="70" y="50" width="460" height="800" fill="#1C130D" stroke="#0E0906" stroke-width="4"/>
      <rect x="90" y="70" width="420" height="780" fill="url(#woodGrad_door_13)" filter="url(#bevel_door_13)"/>
      <rect x="90" y="70" width="420" height="780" fill="url(#grain_door_13)"/>

      <!-- 3 Massive 3D Coffered Panels with Heavy Bevels -->
      <!-- Panel 1 -->
      <rect x="130" y="110" width="340" height="200" rx="4" fill="#180F0A" stroke="#C5A059" stroke-width="2.5" filter="url(#bevel_door_13)"/>
      <rect x="155" y="130" width="290" height="160" rx="2" fill="url(#woodGrad_door_13)" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="5,3"/>

      <!-- Panel 2 -->
      <rect x="130" y="345" width="340" height="200" rx="4" fill="#180F0A" stroke="#C5A059" stroke-width="2.5" filter="url(#bevel_door_13)"/>
      <rect x="155" y="365" width="290" height="160" rx="2" fill="url(#woodGrad_door_13)" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="5,3"/>

      <!-- Panel 3 -->
      <rect x="130" y="580" width="340" height="200" rx="4" fill="#180F0A" stroke="#C5A059" stroke-width="2.5" filter="url(#bevel_door_13)"/>
      <rect x="155" y="600" width="290" height="160" rx="2" fill="url(#woodGrad_door_13)" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="5,3"/>

      <!-- Luxury Walnut Entrance Pull -->
      <rect x="445" y="400" width="18" height="140" rx="3" fill="url(#brass_door_13)" filter="url(#bevel_door_13)"/>
      <circle cx="454" cy="425" r="4" fill="#120B07"/>

      <rect x="60" y="850" width="480" height="25" fill="#20150E" stroke="#0D0804" stroke-width="2"/>
    
    <!-- Editorial Architectural Tag -->
    <text x="300" y="878" font-family="'Playfair Display', Georgia, serif" font-size="11" fill="#77716A" text-anchor="middle" letter-spacing="3">AANGAN DOORS • AD-013 SIGNATURE WALNUT • AMERICAN WALNUT & TEAK</text>
  </svg>