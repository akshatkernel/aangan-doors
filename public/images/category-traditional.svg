<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  
    <defs>
      <!-- Wood Grain Gradient -->
      <linearGradient id="woodGrad_cat_trad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1A0C06" />
        <stop offset="25%" stop-color="#2D180F" />
        <stop offset="50%" stop-color="#482B1C" />
        <stop offset="75%" stop-color="#2D180F" />
        <stop offset="100%" stop-color="#1A0C06" />
      </linearGradient>

      <!-- Vertical Grain Texture Pattern -->
      <pattern id="grain_cat_trad" width="40" height="200" patternUnits="userSpaceOnUse">
        <line x1="8" y1="0" x2="8" y2="200" stroke="#1A0C06" stroke-width="0.8" opacity="0.35"/>
        <line x1="16" y1="0" x2="16" y2="200" stroke="#482B1C" stroke-width="0.6" opacity="0.4"/>
        <line x1="25" y1="0" x2="25" y2="200" stroke="#1A0C06" stroke-width="1.2" opacity="0.3"/>
        <line x1="33" y1="0" x2="33" y2="200" stroke="#482B1C" stroke-width="0.5" opacity="0.3"/>
      </pattern>

      <!-- 3D Bevel Shadow Filter -->
      <filter id="bevel_cat_trad" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#050302" flood-opacity="0.55"/>
      </filter>

      <!-- Recessed Panel Shadow -->
      <filter id="inset_cat_trad" x="-5%" y="-5%" width="110%" height="110%">
        <feOffset dx="2" dy="3"/>
        <feGaussianBlur stdDeviation="3" result="offset-blur"/>
        <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
        <feFlood flood-color="#000000" flood-opacity="0.6" result="color"/>
        <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
        <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
      </filter>

      <!-- Brass Hardware Metallic Gradient -->
      <linearGradient id="brass_cat_trad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#EED58E" />
        <stop offset="40%" stop-color="#C5A059" />
        <stop offset="70%" stop-color="#8F6B2E" />
        <stop offset="100%" stop-color="#D4AF37" />
      </linearGradient>
    </defs>
  
  <rect width="600" height="800" fill="#EAE1D5"/>
  <path d="M 60 760 L 60 250 Q 300 40 540 250 L 540 760 Z" fill="#3A1E14" stroke="#210E07" stroke-width="8"/>
  <rect x="90" y="120" width="195" height="640" fill="url(#woodGrad_cat_trad)"/>
  <rect x="315" y="120" width="195" height="640" fill="url(#woodGrad_cat_trad)"/>
  
    <circle cx="140" cy="200" r="8" fill="url(#brass_cat_trad)"/>
    <circle cx="230" cy="200" r="8" fill="url(#brass_cat_trad)"/>
    <circle cx="370" cy="200" r="8" fill="url(#brass_cat_trad)"/>
    <circle cx="460" cy="200" r="8" fill="url(#brass_cat_trad)"/>
  
    <circle cx="140" cy="320" r="8" fill="url(#brass_cat_trad)"/>
    <circle cx="230" cy="320" r="8" fill="url(#brass_cat_trad)"/>
    <circle cx="370" cy="320" r="8" fill="url(#brass_cat_trad)"/>
    <circle cx="460" cy="320" r="8" fill="url(#brass_cat_trad)"/>
  
    <circle cx="140" cy="440" r="8" fill="url(#brass_cat_trad)"/>
    <circle cx="230" cy="440" r="8" fill="url(#brass_cat_trad)"/>
    <circle cx="370" cy="440" r="8" fill="url(#brass_cat_trad)"/>
    <circle cx="460" cy="440" r="8" fill="url(#brass_cat_trad)"/>
  
    <circle cx="140" cy="560" r="8" fill="url(#brass_cat_trad)"/>
    <circle cx="230" cy="560" r="8" fill="url(#brass_cat_trad)"/>
    <circle cx="370" cy="560" r="8" fill="url(#brass_cat_trad)"/>
    <circle cx="460" cy="560" r="8" fill="url(#brass_cat_trad)"/>
  
    <circle cx="140" cy="680" r="8" fill="url(#brass_cat_trad)"/>
    <circle cx="230" cy="680" r="8" fill="url(#brass_cat_trad)"/>
    <circle cx="370" cy="680" r="8" fill="url(#brass_cat_trad)"/>
    <circle cx="460" cy="680" r="8" fill="url(#brass_cat_trad)"/>
  
  <circle cx="260" cy="420" r="15" fill="none" stroke="url(#brass_cat_trad)" stroke-width="4"/>
  <circle cx="340" cy="420" r="15" fill="none" stroke="url(#brass_cat_trad)" stroke-width="4"/>
</svg>